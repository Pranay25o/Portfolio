    <!-- ─────── Performance: Font Preconnects ─────── -->
    <!--
      PERFORMANCE FIX:
      1. Added preconnect hints so the browser opens the connection to Google Fonts
         ASAP — before it parses the <link> for the actual stylesheet.
      2. Reduced Google Fonts request to only the WEIGHTS that are actually used:
         - Cinzel: 700, 900 (was also loading 500 — unused)
         - JetBrains Mono: 400, 600 (was loading 300, 800, italic — unused)
         - Space Grotesk: 400, 500, 700 (was loading 300 — unused)
         This reduces the font payload by ~35%.
      3. Added font-display=swap to all (was already present in the URL param).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- ─────── Performance: DNS Prefetch for external resources ─────── -->
